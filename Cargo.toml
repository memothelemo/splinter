[package]
name = "splinter"
description = "Opinionated sharding system for twilight-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8"
flume = "0.12"
futures = "0.3"
pin-project-lite = "0.2"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["sync"] }
tracing = "0.1"
twilight-gateway = { version = "0.17" }

[workspace]
members = ["examples/*"]
resolver = "3"

[workspace.package]
edition = "2021"
publish = false
rust-version = "1.92.0"

[workspace.dependencies]
anyhow = "1.0.101"
dotenvy = "0.15.7"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"

[workspace.dependencies.rustls]
version = "0.23.36"
default-features = false
features = ["ring", "std", "tls12"]
